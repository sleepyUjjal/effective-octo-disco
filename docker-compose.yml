
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - RUN_SCHEDULER=true
      - DATABASE_URL=sqlite:///./wind_data.db
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
